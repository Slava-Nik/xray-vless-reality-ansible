---
# Deploy Xray VLESS + Reality on VPS
#
# Run from repo root:
#   ansible-playbook playbooks/setup-vless-reality.yml
#
# Test SSH:
#   ansible vps -m ping

- name: Deploy VLESS + Reality (Xray)
  hosts: vps
  gather_facts: true

  vars_files:
    - ../inventory/group_vars/vps/xray.yml

  roles:
    - role: xray-vless-reality
