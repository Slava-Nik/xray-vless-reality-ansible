---
# Shared Xray settings for playbooks targeting the vps group.
# Per host set: ansible_host, vpn_domain (must match sites/<vpn_domain>/).

xray_config_path: /usr/local/etc/xray/config.json
xray_binary: /usr/local/bin/xray
xray_credentials_path: /etc/xray/.ansible-credentials
xray_clients_registry_path: /etc/xray/.ansible-extra-clients.yml
xray_log_dir: /var/log/xray

# Required per host in inventory/hosts.yml
# vpn_domain: example.com

xray_site_local_dir: "{{ playbook_dir }}/../sites/{{ vpn_domain }}"
xray_site_remote_dir: "/var/www/{{ vpn_domain }}"
xray_nginx_site_path: "/etc/nginx/sites-available/{{ vpn_domain }}"
xray_nginx_site_link: "/etc/nginx/sites-enabled/{{ vpn_domain }}"
xray_nginx_ssl_listen: "127.0.0.1:8443"
xray_cert_live_dir: "/etc/letsencrypt/live/{{ vpn_domain }}"
# Empty → certbot --register-unsafely-without-email
xray_certbot_email: ""

xray_reality_dest: "127.0.0.1:8443"
xray_reality_xver: 0
xray_reality_show: false
# Filled in preflight from vpn_domain (+ www if DNS matches)
# xray_reality_server_names:

xray_default_client_names:
  - client-1
  - client-2
  - client-3

xray_client_flow: "xtls-rprx-vision"
xray_client_fingerprint: "chrome"
xray_client_outbound_tag: "vless-reality"
# Client configs connect by domain (SNI / camouflage), not raw IP
xray_client_address: "{{ vpn_domain }}"

xray_local_output_dir: "{{ playbook_dir }}/../output"
xray_client_output_dir: "{{ xray_local_output_dir }}/{{ ansible_host | default(inventory_hostname) }}"
