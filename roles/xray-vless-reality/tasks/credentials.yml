---
# Reality keys + default clients (persisted on the server)

- name: Check existing credentials file
  ansible.builtin.stat:
    path: "{{ xray_credentials_path }}"
  register: xray_credentials_stat

- name: Read existing credentials file
  ansible.builtin.slurp:
    src: "{{ xray_credentials_path }}"
  register: xray_credentials_slurp
  when: xray_credentials_stat.stat.exists

- name: Parse existing credentials
  ansible.builtin.set_fact:
    xray_creds_parsed: "{{ _parsed }}"
  vars:
    _parsed: >-
      {{
        (xray_credentials_slurp.content | b64decode | from_yaml)
        if (xray_credentials_stat.stat.exists and not (xray_credentials_slurp.skipped | default(false)))
        else {}
      }}

- name: Check legacy extra-clients registry
  ansible.builtin.stat:
    path: "{{ xray_clients_registry_path }}"
  register: xray_extra_clients_stat

- name: Read legacy extra-clients registry
  ansible.builtin.slurp:
    src: "{{ xray_clients_registry_path }}"
  register: xray_extra_clients_slurp
  when: xray_extra_clients_stat.stat.exists

- name: Build initial clients list from credentials / legacy formats
  ansible.builtin.set_fact:
    xray_clients: "{{ _clients }}"
    xray_private_key: "{{ xray_creds_parsed.private_key | default('') | trim }}"
    xray_public_key: "{{ xray_creds_parsed.public_key | default('') | trim }}"
    xray_short_id: "{{ xray_creds_parsed.short_id | default('') | trim }}"
  vars:
    _from_creds: "{{ xray_creds_parsed.clients | default([]) }}"
    _legacy_primary: >-
      {{
        [{'name': 'client-1', 'uuid': xray_creds_parsed.client_uuid | trim}]
        if (xray_creds_parsed.client_uuid | default('') | trim | length) > 0
           and (_from_creds | length) == 0
        else []
      }}
    _legacy_extra: >-
      {{
        (
          (xray_extra_clients_slurp.content | b64decode | from_yaml).clients
          if (xray_extra_clients_stat.stat.exists and not (xray_extra_clients_slurp.skipped | default(false)))
          else []
        )
        if (_from_creds | length) == 0
        else []
      }}
    _clients: "{{ _from_creds if (_from_creds | length) > 0 else (_legacy_primary + _legacy_extra) }}"

- name: Decide whether Reality keys need generation
  ansible.builtin.set_fact:
    xray_keys_need_generate: >-
      {{
        (xray_private_key | length) == 0
        or (xray_public_key | length) == 0
        or (xray_short_id | length) == 0
      }}

- name: Generate Reality keys and shortId
  when: xray_keys_need_generate | bool
  ansible.builtin.shell: |
    set -euo pipefail
    out=$("{{ xray_binary }}" x25519 2>&1)
    private=$(echo "$out" | awk -F': *' 'tolower($1) ~ /private/ {print $2; exit}')
    public=$(echo "$out" | awk -F': *' 'tolower($1) ~ /password|public/ {print $2; exit}' | awk '{print $1}')
    short_id=$(openssl rand -hex 4)
    if [[ -z "$private" || -z "$public" || -z "$short_id" ]]; then
      echo "Failed to parse x25519 output:" >&2
      echo "$out" >&2
      exit 1
    fi
    printf '%s\n%s\n%s\n' "$private" "$public" "$short_id"
  args:
    executable: /bin/bash
  register: xray_keys_cmd
  changed_when: true

- name: Set generated Reality keys
  when: xray_keys_need_generate | bool
  ansible.builtin.set_fact:
    xray_private_key: "{{ xray_keys_cmd.stdout_lines[0] | trim }}"
    xray_public_key: "{{ xray_keys_cmd.stdout_lines[1] | trim }}"
    xray_short_id: "{{ xray_keys_cmd.stdout_lines[2] | trim }}"

- name: Determine missing default client names
  ansible.builtin.set_fact:
    xray_missing_client_names: "{{ xray_default_client_names | difference(xray_clients | map(attribute='name') | list) }}"

- name: Generate UUIDs for missing default clients
  when: xray_missing_client_names | length > 0
  ansible.builtin.command: "{{ xray_binary }} uuid"
  register: xray_new_uuids
  loop: "{{ xray_missing_client_names }}"
  changed_when: true

- name: Append missing default clients
  when: xray_missing_client_names | length > 0
  ansible.builtin.set_fact:
    xray_clients: "{{ xray_clients + _added }}"
  vars:
    _added: >-
      {{
        dict(
          xray_missing_client_names
          | zip(xray_new_uuids.results | map(attribute='stdout') | map('trim') | list)
        )
        | dict2items(key_name='name', value_name='uuid')
      }}

- name: Persist credentials file
  ansible.builtin.template:
    src: credentials.yml.j2
    dest: "{{ xray_credentials_path }}"
    owner: root
    group: root
    mode: "0600"

- name: Assert credentials are valid
  ansible.builtin.assert:
    that:
      - xray_private_key | length > 0
      - xray_public_key | length > 0
      - xray_short_id | length > 0
      - xray_clients | length >= (xray_default_client_names | length)
      - xray_clients | rejectattr('uuid', 'defined') | list | length == 0
    fail_msg: "Credentials are incomplete after generation."
