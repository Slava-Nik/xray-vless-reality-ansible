---
# === 0. Guard ===

- name: Refuse check mode
  ansible.builtin.fail:
    msg: >-
      This playbook does not support --check (credentials, shell, and UFW cannot be dry-run safely).
      Test SSH with: ansible vps -m ping
      Deploy with: ansible-playbook playbooks/setup-vless-reality.yml
  when: ansible_check_mode

- name: Include preflight checks
  ansible.builtin.include_tasks: preflight.yml

# === 1. System prep ===

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ufw
      - openssl
      - dnsutils
    state: present

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: xray_enable_ip_forward

# === 2. Install Xray ===

- name: Check if xray binary exists
  ansible.builtin.stat:
    path: "{{ xray_binary }}"
  register: xray_binary_stat

- name: Install Xray via official script
  ansible.builtin.shell: |
    set -euo pipefail
    bash <(curl -Ls {{ xray_install_script_url }})
  args:
    executable: /bin/bash
  when: not xray_binary_stat.stat.exists

- name: Create xray log directory if not exists
  ansible.builtin.file:
    path: "{{ xray_log_dir }}"
    state: directory
    owner: xray
    group: xray
    mode: "0755"

- name: Ensure xray can write log files
  ansible.builtin.file:
    path: "{{ xray_log_dir }}/{{ item }}"
    state: touch
    owner: xray
    group: xray
    mode: "0640"
    modification_time: preserve
    access_time: preserve
  loop:
    - access.log
    - error.log
  # User=xray in official unit; root-owned logs make restart fail with permission denied.

- name: Create credentials directory if not exists
  ansible.builtin.file:
    path: "{{ xray_credentials_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# === 3. Camouflage site (nginx + TLS) — before Xray uses dest ===

- name: Include camouflage nginx and certificate
  ansible.builtin.include_tasks: camouflage.yml

# === 4. Keys and clients ===

- name: Include credentials and default clients
  ansible.builtin.include_tasks: credentials.yml

# === 5. Server config ===

- name: Deploy Xray server config
  ansible.builtin.template:
    src: server-config.json.j2
    dest: "{{ xray_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ xray_binary }} run -test -config %s"
  notify: Restart xray

- name: Enable and start xray
  ansible.builtin.systemd:
    name: xray
    enabled: true
    state: started
    daemon_reload: true

# === 6. Client configs (saved locally) ===

- name: Ensure local output directory exists
  ansible.builtin.file:
    path: "{{ xray_client_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save client happ links locally
  ansible.builtin.template:
    src: client-happ.txt.j2
    dest: "{{ xray_client_output_dir }}/{{ inventory_hostname }}-{{ client.name }}-client-happ.txt"
    mode: "0600"
  loop: "{{ xray_clients }}"
  loop_control:
    loop_var: client
  delegate_to: localhost
  become: false

- name: Show client happ paths
  ansible.builtin.debug:
    msg: >-
      {{
        ['Done. Happ links saved under ' ~ xray_client_output_dir ~ ':']
        + (xray_clients | map(attribute='name')
           | map('regex_replace', '^(.*)$', inventory_hostname ~ '-\1-client-happ.txt')
           | list)
      }}

# === 7. Firewall ===

- name: Configure UFW
  when: xray_configure_ufw
  block:
    - name: Allow OpenSSH through UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow SSH port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ xray_ssh_port }}"
        proto: tcp

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow Xray port through UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Set UFW defaults (deny incoming, allow outgoing)
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Enable UFW
      community.general.ufw:
        state: enabled
