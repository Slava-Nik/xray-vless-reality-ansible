---
# === 0. Guard ===

- name: Refuse check mode
  ansible.builtin.fail:
    msg: >-
      This playbook does not support --check (credentials, shell, and UFW cannot be dry-run safely).
      Test SSH with: ansible vps -m ping
      Deploy with: ansible-playbook playbooks/vless-reality.yml
  when: ansible_check_mode

# === 1. System prep ===

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - curl
      - ufw
      - openssl
    state: present

- name: Enable IPv4 forwarding
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: xray_enable_ip_forward

# === 2. Install Xray ===

- name: Check if xray binary exists
  ansible.builtin.stat:
    path: "{{ xray_binary }}"
  register: xray_binary_stat

- name: Install Xray via official script
  ansible.builtin.shell: |
    set -euo pipefail
    bash <(curl -Ls {{ xray_install_script_url }})
  args:
    executable: /bin/bash
  when: not xray_binary_stat.stat.exists

- name: Create xray log directory if not exists
  ansible.builtin.file:
    path: "{{ xray_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create credentials directory if not exists
  ansible.builtin.file:
    path: "{{ xray_credentials_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# === 4. Keys and UUID (generated once, then reused) ===

- name: Ensure credentials on server
  block:
    - name: Check existing credentials file
      ansible.builtin.stat:
        path: "{{ xray_credentials_path }}"
      register: xray_credentials_stat

    - name: Read existing credentials file
      ansible.builtin.slurp:
        src: "{{ xray_credentials_path }}"
      register: xray_credentials_slurp
      when: xray_credentials_stat.stat.exists

    - name: Decide whether credentials need generation
      ansible.builtin.set_fact:
        xray_credentials_need_generate: "{{ _need_generate }}"
      vars:
        _parsed: >-
          {{
            (xray_credentials_slurp.content | b64decode | from_yaml)
            if (xray_credentials_stat.stat.exists and not (xray_credentials_slurp.skipped | default(false)))
            else none
          }}
        _need_generate: >-
          {{
            _parsed is none
            or _parsed.client_uuid is not defined
            or (_parsed.client_uuid | default('') | trim) == ''
            or (_parsed.private_key | default('') | trim) == ''
            or (_parsed.public_key | default('') | trim) == ''
            or (_parsed.short_id | default('') | trim) == ''
          }}

    - name: Remove invalid credentials file
      ansible.builtin.file:
        path: "{{ xray_credentials_path }}"
        state: absent
      when:
        - xray_credentials_need_generate
        - xray_credentials_stat.stat.exists

    - name: Generate credentials file
      ansible.builtin.shell: |
        set -euo pipefail
        XRAY="{{ xray_binary }}"
        CREDS="{{ xray_credentials_path }}"
        out=$("$XRAY" x25519 2>&1)
        private=$(echo "$out" | awk -F': *' 'tolower($1) ~ /private/ {print $2; exit}')
        public=$(echo "$out" | awk -F': *' 'tolower($1) ~ /password|public/ {print $2; exit}' | awk '{print $1}')
        uuid=$("$XRAY" uuid | tr -d '[:space:]')
        short_id=$(openssl rand -hex 4)
        if [[ -z "$private" || -z "$public" || -z "$uuid" ]]; then
          echo "Failed to parse x25519 output:" >&2
          echo "$out" >&2
          exit 1
        fi
        umask 077
        printf -- '---\nclient_uuid: %s\nprivate_key: %s\npublic_key: %s\nshort_id: %s\n' \
          "$uuid" "$private" "$public" "$short_id" > "$CREDS"
      args:
        executable: /bin/bash
      when: xray_credentials_need_generate

    - name: Read credentials file
      ansible.builtin.slurp:
        src: "{{ xray_credentials_path }}"
      register: xray_credentials_loaded

    - name: Set credential facts
      ansible.builtin.set_fact:
        xray_client_uuid: "{{ creds.client_uuid }}"
        xray_private_key: "{{ creds.private_key }}"
        xray_public_key: "{{ creds.public_key }}"
        xray_short_id: "{{ creds.short_id }}"
      vars:
        creds: "{{ xray_credentials_loaded.content | b64decode | from_yaml }}"

    - name: Assert credentials are valid
      ansible.builtin.assert:
        that:
          - xray_client_uuid | length > 0
          - xray_private_key | length > 0
          - xray_public_key | length > 0
          - xray_short_id | length > 0
        fail_msg: "Credentials file is missing required fields after generation."

# === 5. Server config ===

- name: Deploy Xray server config
  ansible.builtin.template:
    src: server-config.json.j2
    dest: "{{ xray_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ xray_binary }} run -test -config %s"
  notify: Restart xray

- name: Enable and start xray
  ansible.builtin.systemd:
    name: xray
    enabled: true
    state: started
    daemon_reload: true

# === 6. Client config (saved locally) ===

- name: Ensure local output directory exists
  ansible.builtin.file:
    path: "{{ xray_local_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save client config locally
  ansible.builtin.template:
    src: client-config.json.j2
    dest: "{{ xray_local_output_dir }}/{{ inventory_hostname }}-client-config.json"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Show client config path
  ansible.builtin.debug:
    msg: "Done. Client config saved to: {{ xray_local_output_dir }}/{{ inventory_hostname }}-client-config.json"

# === 7. Firewall ===

- name: Configure UFW
  when: xray_configure_ufw
  block:
    - name: Allow OpenSSH through UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH

    - name: Allow SSH port through UFW
      community.general.ufw:
        rule: allow
        port: "{{ xray_ssh_port }}"
        proto: tcp

    - name: Allow Xray port through UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Set UFW defaults (deny incoming, allow outgoing)
      community.general.ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      loop:
        - { direction: incoming, policy: deny }
        - { direction: outgoing, policy: allow }

    - name: Enable UFW
      community.general.ufw:
        state: enabled
