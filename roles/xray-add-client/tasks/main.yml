---
- name: Refuse check mode
  ansible.builtin.fail:
    msg: "Use: ansible-playbook playbooks/add-another-vless-client.yml -e client_name=my-phone"
  when: ansible_check_mode

- name: Validate client name
  ansible.builtin.assert:
    that:
      - xray_client_name is defined
      - xray_client_name | length > 0
      - xray_client_name is match('^[a-zA-Z0-9][a-zA-Z0-9_-]*$')
    fail_msg: "Pass -e client_name=NAME (letters, numbers, hyphen, underscore)."

- name: Require vpn_domain
  ansible.builtin.assert:
    that:
      - vpn_domain is defined
      - (vpn_domain | trim | length) > 0
    fail_msg: "Set vpn_domain on the host in inventory/hosts.yml."

- name: Check if xray binary exists
  ansible.builtin.stat:
    path: "{{ xray_binary }}"
  register: xray_binary_stat

- name: Fail if Xray is not installed
  ansible.builtin.fail:
    msg: "Xray is not installed. Run playbooks/setup-vless-reality.yml first."
  when: not xray_binary_stat.stat.exists

- name: Check existing credentials file
  ansible.builtin.stat:
    path: "{{ xray_credentials_path }}"
  register: xray_credentials_stat

- name: Fail if credentials file is missing
  ansible.builtin.fail:
    msg: "Credentials not found at {{ xray_credentials_path }}. Run playbooks/setup-vless-reality.yml first."
  when: not xray_credentials_stat.stat.exists

- name: Read server credentials
  ansible.builtin.slurp:
    src: "{{ xray_credentials_path }}"
  register: xray_credentials_slurp

- name: Parse credentials
  ansible.builtin.set_fact:
    xray_creds_parsed: "{{ xray_credentials_slurp.content | b64decode | from_yaml }}"

- name: Set server credential facts
  ansible.builtin.set_fact:
    xray_private_key: "{{ xray_creds_parsed.private_key }}"
    xray_public_key: "{{ xray_creds_parsed.public_key }}"
    xray_short_id: "{{ xray_creds_parsed.short_id }}"
    xray_clients: "{{ _clients }}"
  vars:
    _from_creds: "{{ xray_creds_parsed.clients | default([]) }}"
    _legacy: >-
      {{
        [{'name': 'client-1', 'uuid': xray_creds_parsed.client_uuid | trim}]
        if (xray_creds_parsed.client_uuid | default('') | trim | length) > 0
           and (_from_creds | length) == 0
        else []
      }}
    _clients: "{{ _from_creds if (_from_creds | length) > 0 else _legacy }}"

- name: Resolve www DNS for serverNames
  ansible.builtin.command:
    cmd: dig +short A www.{{ vpn_domain }}
  register: xray_www_dig
  delegate_to: localhost
  become: false
  changed_when: false
  failed_when: false

- name: Set Reality serverNames
  ansible.builtin.set_fact:
    xray_reality_server_names: "{{ _names }}"
  vars:
    _www_ok: >-
      {{
        (ansible_host | string) in (xray_www_dig.stdout_lines | map('trim') | select('match', '^[0-9.]+$') | list)
      }}
    _names: "{{ [vpn_domain] + (['www.' ~ vpn_domain] if (_www_ok | bool) else []) }}"

- name: Detect existing client by name
  ansible.builtin.set_fact:
    xray_existing_client: "{{ (_matches | first) if (_matches | length) > 0 else none }}"
  vars:
    _matches: "{{ xray_clients | selectattr('name', 'equalto', xray_client_name) | list }}"

- name: Reuse UUID when client already exists
  when: xray_existing_client is not none
  ansible.builtin.set_fact:
    xray_new_client_uuid: "{{ xray_existing_client.uuid }}"
    xray_client_already_exists: true

- name: Generate UUID for new client
  when: xray_existing_client is none
  ansible.builtin.command: "{{ xray_binary }} uuid"
  register: xray_new_client_uuid_cmd
  changed_when: true

- name: Add new client to list
  when: xray_existing_client is none
  ansible.builtin.set_fact:
    xray_new_client_uuid: "{{ xray_new_client_uuid_cmd.stdout | trim }}"
    xray_client_already_exists: false
    xray_clients: >-
      {{
        xray_clients + [{'name': xray_client_name, 'uuid': xray_new_client_uuid_cmd.stdout | trim}]
      }}

- name: Persist credentials with new client
  when: not xray_client_already_exists
  ansible.builtin.copy:
    dest: "{{ xray_credentials_path }}"
    mode: "0600"
    content: |
      ---
      private_key: {{ xray_private_key }}
      public_key: {{ xray_public_key }}
      short_id: {{ xray_short_id }}
      clients:
      {% for client in xray_clients %}
        - name: {{ client.name }}
          uuid: {{ client.uuid }}
      {% endfor %}

- name: Deploy updated server config
  when: not xray_client_already_exists
  ansible.builtin.template:
    src: server-config.json.j2
    dest: "{{ xray_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ xray_binary }} run -test -config %s"

- name: Ensure local output directory exists
  ansible.builtin.file:
    path: "{{ xray_client_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save new client happ link locally
  ansible.builtin.template:
    src: client-happ.txt.j2
    dest: "{{ xray_client_output_dir }}/{{ inventory_hostname }}-{{ xray_client_name }}-client-happ.txt"
    mode: "0600"
  vars:
    client:
      name: "{{ xray_client_name }}"
      uuid: "{{ xray_new_client_uuid }}"
  delegate_to: localhost
  become: false

- name: Restart xray and recover SSH
  when: not xray_client_already_exists
  block:
    - name: Restart xray asynchronously
      ansible.builtin.systemd:
        name: xray
        state: restarted
        daemon_reload: true
      async: 45
      poll: 0
      register: xray_restart_job

    - name: Wait for SSH after xray restart
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 60

    - name: Ensure xray restart finished
      ansible.builtin.async_status:
        jid: "{{ xray_restart_job.ansible_job_id }}"
      register: xray_restart_result
      until: xray_restart_result.finished
      retries: 30
      delay: 1

    - name: Confirm xray is running
      ansible.builtin.systemd:
        name: xray
        state: started

- name: Show client happ path
  ansible.builtin.debug:
    msg:
      - "{{ 'Client already existed on server; local happ link refreshed.' if xray_client_already_exists else 'New client added on server.' }}"
      - "Happ link saved to: {{ xray_client_output_dir }}/{{ inventory_hostname }}-{{ xray_client_name }}-client-happ.txt"
