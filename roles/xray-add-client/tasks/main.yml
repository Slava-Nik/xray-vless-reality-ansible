---
- name: Refuse check mode
  ansible.builtin.fail:
    msg: "Use: ansible-playbook playbooks/add-another-vless-client.yml -e client_name=my-phone"
  when: ansible_check_mode

- name: Validate client name
  ansible.builtin.assert:
    that:
      - xray_client_name is defined
      - xray_client_name | length > 0
      - xray_client_name is match('^[a-zA-Z0-9][a-zA-Z0-9_-]*$')
    fail_msg: "Pass -e client_name=NAME (letters, numbers, hyphen, underscore)."

- name: Check if xray binary exists
  ansible.builtin.stat:
    path: "{{ xray_binary }}"
  register: xray_binary_stat

- name: Fail if Xray is not installed
  ansible.builtin.fail:
    msg: "Xray is not installed. Run playbooks/setup-vless-reality.yml first."
  when: not xray_binary_stat.stat.exists

- name: Check existing credentials file
  ansible.builtin.stat:
    path: "{{ xray_credentials_path }}"
  register: xray_credentials_stat

- name: Fail if credentials file is missing
  ansible.builtin.fail:
    msg: "Credentials not found at {{ xray_credentials_path }}. Run playbooks/setup-vless-reality.yml first."
  when: not xray_credentials_stat.stat.exists

- name: Read server credentials
  ansible.builtin.slurp:
    src: "{{ xray_credentials_path }}"
  register: xray_credentials_slurp

- name: Set server credential facts
  ansible.builtin.set_fact:
    xray_primary_client_uuid: "{{ creds.client_uuid }}"
    xray_private_key: "{{ creds.private_key }}"
    xray_public_key: "{{ creds.public_key }}"
    xray_short_id: "{{ creds.short_id }}"
  vars:
    creds: "{{ xray_credentials_slurp.content | b64decode | from_yaml }}"

- name: Check extra clients registry
  ansible.builtin.stat:
    path: "{{ xray_clients_registry_path }}"
  register: xray_extra_clients_stat

- name: Read extra clients registry
  ansible.builtin.slurp:
    src: "{{ xray_clients_registry_path }}"
  register: xray_extra_clients_slurp
  when: xray_extra_clients_stat.stat.exists

- name: Set extra clients list
  ansible.builtin.set_fact:
    xray_extra_clients: "{{ _registry.clients | default([]) }}"
  vars:
    _registry: >-
      {{
        (xray_extra_clients_slurp.content | b64decode | from_yaml)
        if (xray_extra_clients_stat.stat.exists and not (xray_extra_clients_slurp.skipped | default(false)))
        else {'clients': []}
      }}

- name: Detect existing client by name
  ansible.builtin.set_fact:
    xray_existing_client: "{{ _matches | first | default(none) }}"
  vars:
    _matches: "{{ xray_extra_clients | selectattr('name', 'equalto', xray_client_name) | list }}"

- name: Reuse UUID when client already exists
  when: xray_existing_client is not none
  ansible.builtin.set_fact:
    xray_new_client_uuid: "{{ xray_existing_client.uuid }}"
    xray_client_already_exists: true

- name: Generate UUID for new client
  when: xray_existing_client is none
  ansible.builtin.command: "{{ xray_binary }} uuid"
  register: xray_new_client_uuid_cmd
  changed_when: true

- name: Add new client to registry
  when: xray_existing_client is none
  ansible.builtin.set_fact:
    xray_new_client_uuid: "{{ xray_new_client_uuid_cmd.stdout | trim }}"
    xray_client_already_exists: false
    xray_extra_clients: >-
      {{
        xray_extra_clients + [{'name': xray_client_name, 'uuid': xray_new_client_uuid_cmd.stdout | trim}]
      }}

- name: Save extra clients registry
  when: not xray_client_already_exists
  ansible.builtin.copy:
    dest: "{{ xray_clients_registry_path }}"
    mode: "0600"
    content: |
      ---
      clients:
      {% for client in xray_extra_clients %}
        - name: {{ client.name }}
          uuid: {{ client.uuid }}
      {% endfor %}

- name: Deploy updated server config
  when: not xray_client_already_exists
  ansible.builtin.template:
    src: server-config.json.j2
    dest: "{{ xray_config_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ xray_binary }} run -test -config %s"

# Save local files before restart — restart can drop Ansible's shared SSH connection.
- name: Ensure local output directory exists
  ansible.builtin.file:
    path: "{{ xray_client_output_dir }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Save new client config locally
  ansible.builtin.template:
    src: client-config.json.j2
    dest: "{{ xray_client_output_dir }}/{{ inventory_hostname }}-{{ xray_client_name }}-client-config.json"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Save new client happ link locally
  ansible.builtin.template:
    src: client-happ.txt.j2
    dest: "{{ xray_client_output_dir }}/{{ inventory_hostname }}-{{ xray_client_name }}-client-happ.txt"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Restart xray and recover SSH
  when: not xray_client_already_exists
  block:
    # Async so Ansible does not sit on the shared SSH socket while xray restarts.
    - name: Restart xray asynchronously
      ansible.builtin.systemd:
        name: xray
        state: restarted
        daemon_reload: true
      async: 45
      poll: 0
      register: xray_restart_job

    - name: Wait for SSH after xray restart
      ansible.builtin.wait_for_connection:
        delay: 2
        timeout: 60

    - name: Ensure xray restart finished
      ansible.builtin.async_status:
        jid: "{{ xray_restart_job.ansible_job_id }}"
      register: xray_restart_result
      until: xray_restart_result.finished
      retries: 30
      delay: 1

    - name: Confirm xray is running
      ansible.builtin.systemd:
        name: xray
        state: started

- name: Show client config paths
  ansible.builtin.debug:
    msg:
      - "{{ 'Client already existed on server; local configs refreshed.' if xray_client_already_exists else 'New client added on server.' }}"
      - "Client config saved to: {{ xray_client_output_dir }}/{{ inventory_hostname }}-{{ xray_client_name }}-client-config.json"
      - "Happ link saved to: {{ xray_client_output_dir }}/{{ inventory_hostname }}-{{ xray_client_name }}-client-happ.txt"
